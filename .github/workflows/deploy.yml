# Pubblica PokéKnow su GitHub Pages a ogni push su main.
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permette di lanciarlo a mano dalla scheda Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; quello in corso viene completato.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Indirizzo e sottocartella del sito (es. /pokeknow/ oppure / con un dominio tuo).
      - id: pages
        uses: actions/configure-pages@v6

      # I CSV di PokéAPI restano in cache tra un deploy e l'altro: niente download ogni volta.
      # La chiave cambia ogni settimana, così i dati si aggiornano da soli.
      - id: week
        run: echo "n=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/csv
          key: pokeapi-csv-${{ steps.week.outputs.n }}
          restore-keys: pokeapi-csv-

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
